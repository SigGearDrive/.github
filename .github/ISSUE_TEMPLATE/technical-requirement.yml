name: Technical Requirement
description: Ask a public technical question about torque, speed, backlash, voltage, interfaces, control, or integration.
title: "[Technical Requirement] "
body:
  - type: markdown
    attributes:
      value: |
        Thank you for contacting SigGear. Our engineers normally reply within 24 hours.

        **Privacy notice:** GitHub issues are public. Do not post confidential drawings, customer names, private contact details, proprietary dimensions, passwords, or unreleased project information. For private files, samples, quotations, or confidential discussions, use the [private request page](https://siggeardrive.github.io/SigGear-product-docs/request-cad-sample-quote/).

  - type: dropdown
    id: product_type
    attributes:
      label: Product type
      options:
        - Integrated robot joint actuator
        - Cycloidal reducer
        - Planetary gearbox
        - Gear motor
        - Motor and gearbox combination
        - Not sure / need engineering recommendation
    validations:
      required: true

  - type: textarea
    id: application
    attributes:
      label: Application scenario
      description: Describe only the non-confidential machine, robot, joint, axis, or mechanism where the product will be used.
      placeholder: Example: humanoid robot knee joint, collaborative robot wrist, AGV wheel drive, medical pump, or robotic gripper.
    validations:
      required: true

  - type: input
    id: torque
    attributes:
      label: Required torque
      description: Include rated and peak torque when available.
      placeholder: Example: 20 Nm rated, 60 Nm peak
    validations:
      required: true

  - type: input
    id: speed
    attributes:
      label: Required output speed
      placeholder: Example: 100 rpm rated, 150 rpm maximum
    validations:
      required: true

  - type: input
    id: voltage
    attributes:
      label: Voltage and power
      placeholder: Example: 48 VDC, 500 W

  - type: input
    id: backlash
    attributes:
      label: Backlash requirement
      placeholder: Example: less than 10 arcmin, less than 1 arcmin, or not specified

  - type: input
    id: dimensions
    attributes:
      label: Maximum dimensions and weight
      placeholder: Example: OD <= 100 mm, length <= 55 mm, weight <= 1.5 kg

  - type: textarea
    id: interfaces
    attributes:
      label: Mechanical and electrical interfaces
      placeholder: Mounting flange, shaft or hollow-bore size, encoder, brake, CAN, RS485, EtherCAT, PWM, or other requirements.

  - type: textarea
    id: operating_conditions
    attributes:
      label: Operating conditions
      placeholder: Duty cycle, radial or axial load, shock load, temperature, noise target, service life, IP rating, or special environment.

  - type: input
    id: quantity
    attributes:
      label: Prototype and estimated production quantity
      placeholder: Example: 5 samples, then 500 units per year

  - type: textarea
    id: references
    attributes:
      label: Public reference products or non-confidential links
      description: Do not attach confidential drawings or files to a public issue. Use the private request page for restricted materials.
      placeholder: Public competitor model, public datasheet, or non-confidential reference link.

  - type: textarea
    id: other
    attributes:
      label: Additional non-confidential requirements
      placeholder: Target lead time, certification, customization category, or other public-safe questions.
